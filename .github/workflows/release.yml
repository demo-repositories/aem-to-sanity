name: Release

# Two-step release flow driven by Changesets:
#
# 1. Pushes to main that carry pending changesets (`.changeset/*.md`) cause
#    this workflow to open/update a "Version Packages" PR. That PR bumps the
#    fixed version line across all publishable packages and rolls the
#    changeset summaries into each package's CHANGELOG.md.
# 2. Merging the Version Packages PR triggers this workflow again; with no
#    pending changesets left it runs `pnpm release` (build + `changeset
#    publish`): every public package is published to npm, the
#    `<pkg>@<version>` tags are pushed, and GitHub Releases are created with
#    notes from the CHANGELOG entries.
#
# Consumers install from npm (`npm create @shehjad/aem-to-sanity`, or the
# aem-to-sanity-* packages directly). Publishing authenticates via npm
# **trusted publishing** (OIDC) — no NPM_TOKEN secret. Each published package
# must list this repo + `release.yml` as a Trusted Publisher on npmjs.com
# (package page → Settings → Trusted Publisher); see docs/releasing.md.

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm ≥ 11.5.1; Node 22 bundles npm 10.x.
      # `changeset publish` shells out to `npm publish`, which picks this up.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or tag release
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
